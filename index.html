===================================================== */

const money = n => n.toLocaleString(
  "pt-BR",
  {
    style:"currency",
    currency:"BRL"
  }
);


function render(){

  const q =
    document
    .querySelector("#search")
    .value
    .toLowerCase()
    .trim();

  const cat =
    document
    .querySelector("#category")
    .value;


  const list = products.filter(p =>

    (cat==="all" || p.category===cat)

    &&

    (
      `${p.name} ${p.description} ${p.category}`
      .toLowerCase()
      .includes(q)
    )

  );


  const box =
    document.querySelector("#products");

  const empty =
    document.querySelector("#empty");


  box.innerHTML="";

  empty.hidden =
    list.length > 0;


  list.forEach(p => {

    const msg =
      encodeURIComponent(
        `Olá! Tenho interesse no produto "${p.name}" no valor de ${money(p.price)}.`
      );


    box.insertAdjacentHTML(
      "beforeend",

      `

      <article class="card">

        <img
          src="${p.image}"
          alt="${p.name}"
          loading="lazy"
        >

        <div class="content">

          <div class="category">
            ${p.category}
          </div>

          <h2>
            ${p.name}
          </h2>

          <div class="desc">
            ${p.description}
          </div>

          <div class="price">
            ${money(p.price)}
          </div>

          <a
            class="buy"
            target="_blank"
            rel="noopener"
            href="https://wa.me/${WHATSAPP}?text=${msg}"
          >
            Comprar pelo WhatsApp
          </a>

        </div>

      </article>

      `
    );

  });

}


/* =====================================================
   CRIA AS CATEGORIAS AUTOMATICAMENTE
===================================================== */

const cats =
  [
    ...new Set(
      products.map(p => p.category)
    )
  ];


cats.forEach(c => {

  document
  .querySelector("#category")
  .insertAdjacentHTML(
    "beforeend",
    `<option value="${c}">${c}</option>`
  );

});


/* =====================================================
   PESQUISA
===================================================== */

document
.querySelector("#search")
.addEventListener(
  "input",
  render
);


/* =====================================================
   FILTRO DE CATEGORIA
===================================================== */

document
.querySelector("#category")
.addEventListener(
  "change",
  render
);


/* =====================================================
   INICIA O SITE
===================================================== */

render();
